# Screenshot list for the user manual. Each id matches a `<!-- SHOT: <id> -->` line in docs/manual/<lang>/*.md.
# capture.mjs implements this list against the local demo application and saves img/<lang>/<id>.png for every language
# (tr, en, es, pl, lv): `node capture.mjs [lang ...] [--only id,id] [--headed]`. build.mjs inserts the images.
#
# Rules for capturing:
# - Local demo environment only (flag Features:OrgRoleModel on), never production.
# - Only [DEMO] records and the demo users; no real person's data may be visible. Where a page lists real records
#   (beekeeper or apiary lists, audit log, dashboard activity), filter to [DEMO] records or crop to the [DEMO] rows.
# - Account names must not be readable in the published images: crop or blur the user name in the avatar menu,
#   greetings, "entered by / approved by" lines and the audit log.
# - Switch the UI language with /Home/SetLanguage?culture=<lang>&returnUrl=<path> before each capture.
# - viewport: desktop = 1440 x 900, phone = 390 x 844 (device scale factor 2). full_page: false unless stated.
# - role: sign in as a user with this membership; "anonymous" = not signed in.
#
# Demo records (names as in the local demo data):
#   processor  [DEMO] Kovan Bal İşleme            (Processing, Packing, Wholesale)
#   laboratory [DEMO] Analiz Laboratuvarı          (Laboratory, accredited)
#   market     [DEMO] Şehir Marketi                (Retail)
#   association [DEMO] Arıcılar Birliği            (Association)
#   beekeeper  [DEMO] Zeynep Kovancı, apiary [DEMO] Kekik Yaylası Arılığı
#   batch      [DEMO] Kekik Balı 2026 (finalized), its lot from [DEMO] Kekik Yaylası Arılığı
#   open batch [DEMO] Orman Balı 2026 (CCP 4 submitted with a moisture value outside its limit)
#   requested  [DEMO] Yayla Çiçek Balı 2026 (all CCPs approved, finalizing requested)
#   lots       three [DEMO] lots of 2026-10-09 told apart by amount: 61.25 kg (CCP 0 submitted, sample sent),
#              62.5 kg (untouched, no sample), 63.75 kg (CCP 0 approved, lab report submitted)
#   shipment   a pending [DEMO] shipment of [DEMO] Kekik Balı 2026 to [DEMO] Şehir Marketi

defaults:
  file: img/{lang}/{id}.png
  languages: [tr, en, es, pl, lv]

